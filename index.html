<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planner 2026</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planner">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 26 26%22%3E%3Crect width=%2226%22 height=%2226%22 rx=%227%22 fill=%22%230a84ff%22/%3E%3Cpath d=%22M7 9.5h12M7 13.5h8M7 17.5h5%22 stroke=%22white%22 stroke-width=%222%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, precise, productive — a personal operating system, not a toy.
   IDEA: a design-tool inspector panel (Framer-style) applied to a paper planner: day, month, habits, people, projects.
   PICTURE: the working planner itself — hourly agenda and month calendar open at load.
   COLOUR and TYPE: pure black ground, graphite panels, one electric blue #0099ff with a blue horizon glow; Inter, tight negative tracking.
   LAYOUT: sticky left rail (top rail on phones), wide content up to 1320px, two-column work areas that stack below 1100px. */
:root{color-scheme:dark;--bg:#000;--p:#0a0a0b;--p2:#111113;--p3:#1a1a1d;--ln:rgba(255,255,255,.08);--ln2:rgba(255,255,255,.16);--ink:#f5f5f7;--mut:#8d8d96;--dim:#55555c;--b:#0099ff;--bs:rgba(0,153,255,.14);--red:#ff6b6b}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{-webkit-tap-highlight-color:transparent;margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;left:0;right:0;bottom:0;height:55vh;background:radial-gradient(90% 100% at 50% 100%,rgba(0,102,255,.5),rgba(0,102,255,.1) 45%,transparent 72%);pointer-events:none;z-index:0}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink);background:transparent;border:0;outline:0;width:100%}
textarea{resize:vertical;min-height:92px}
::placeholder{color:var(--dim)}
:focus-visible{outline:2px solid var(--b);outline-offset:2px;border-radius:8px}
.app{position:relative;z-index:1;display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:22px 14px;border-right:1px solid var(--ln);background:rgba(0,0,0,.7);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-weight:600;font-size:17px;letter-spacing:-.02em}
.brand small{color:var(--mut);font-weight:500}
nav{display:grid;gap:2px}
nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--mut);text-decoration:none;font-weight:500;white-space:nowrap}
nav a svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav a:hover{color:#fff}
nav a.on{background:var(--p3);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.grp{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--mut);background:none;border:0;font-weight:500;width:100%;text-align:left;white-space:nowrap}
.grp:hover{color:#fff}.grp.act{color:#fff}
.grp svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.grp .chev{margin-left:auto;width:14px;height:14px;transition:transform .2s}
.grp[aria-expanded=true] .chev{transform:rotate(90deg)}
.sub-nav{display:grid;gap:2px;margin-left:20px;padding-left:10px;border-left:1px solid var(--ln)}
.sub-nav[hidden]{display:none}
.bento{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.span2{grid-column:span 2}
.hht{display:flex;justify-content:space-between;align-items:center;gap:16px}
.hh{display:block;padding:26px 28px;background:radial-gradient(90% 140% at 100% 0%,rgba(0,102,255,.32),transparent 55%),linear-gradient(180deg,var(--p2),var(--p))}
.clk{font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums}
.qa{display:flex;gap:8px;margin-top:18px;max-width:520px}
.qa .add{margin:0;flex:1;border-style:solid;background:rgba(255,255,255,.04);height:44px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .tr{stroke:var(--p3)}.ring .vl{stroke:url(#rg);transition:stroke-dashoffset .6s}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring b{font-size:34px;font-weight:600;letter-spacing:-.04em;line-height:1}
.ring span{font-size:12px;color:var(--mut)}
.wb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.wb div{font-size:12.5px;color:var(--mut)}.wb b{display:block;color:#fff;font-size:15px;font-variant-numeric:tabular-nums}
.tl{display:grid}
.tl a{display:grid;grid-template-columns:58px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--ln);color:var(--ink);text-decoration:none;align-items:baseline}
.tl a:last-child{border-bottom:0}
.tl .h{font-size:20px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tl .h.nw{color:var(--b)}
.tl .e{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl{color:var(--b);font-size:13px;text-decoration:none;white-space:nowrap}
.gmini{border-color:rgba(245,180,26,.35);background:radial-gradient(90% 120% at 100% 0%,rgba(245,180,26,.14),transparent 60%),linear-gradient(180deg,#0e0d0a,#070707)}
.gmini h2,.gmini .cl{color:#f5b51b}
.gmini .st{font-family:Oswald,Inter,sans-serif;text-transform:uppercase;font-size:26px;font-weight:700;line-height:1;letter-spacing:.02em}
.gmini .pt em{background:#f5b51b}.gmini .pt em::after{display:none}
.gmini input[type=checkbox]:checked{background:#f5b51b;border-color:#f5b51b}.gmini input[type=checkbox]:checked::after{border-color:#000}
.big{font-size:30px;font-weight:600;letter-spacing:-.035em;line-height:1.05;font-variant-numeric:tabular-nums}
.mrow{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-top:12px}
.mtr{height:8px;border-radius:8px;background:var(--p3);margin-top:6px;overflow:hidden;position:relative}
.mtr em{border-radius:8px}.mtr em.over{background:var(--red)}
.wk7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wk7 button{background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:10px 2px 8px;display:grid;justify-items:center;gap:6px;font-size:12px;color:var(--mut);position:relative}
.wk7 button b{font-size:17px;color:#fff;font-weight:600}
.wk7 button.td{border-color:var(--b);background:var(--bs)}
.wk7 .dot{width:7px;height:7px;border-radius:50%;background:var(--c,var(--p3))}
.wk7 .vb{width:70%;height:3px;background:var(--p3);border-radius:3px;overflow:hidden}
.pj{padding:8px 0;border-bottom:1px solid var(--ln)}.pj:last-child{border-bottom:0}
.pj div{display:flex;justify-content:space-between;gap:8px;font-size:14px}.pj small{color:var(--mut);white-space:nowrap}
@media(max-width:1100px){.bento{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.bento{grid-template-columns:minmax(0,1fr)}.span2{grid-column:auto}}
.hero{padding:28px;background:radial-gradient(120% 140% at 100% 0%,rgba(0,102,255,.35),transparent 55%),linear-gradient(180deg,var(--p2),var(--p))}
.hero h1{max-width:16ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px;margin-top:14px}
.tile{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:14px;border:1px solid var(--ln);background:var(--p2);color:var(--ink);text-decoration:none}
.tile:hover{border-color:var(--b)}
.tile svg{width:22px;height:22px;fill:none;stroke:var(--b);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile small{color:var(--mut)}
/* ---- Gym: poster negro y dorado ---- */
body[data-v=gym]::before{background:radial-gradient(90% 100% at 50% 100%,rgba(245,180,26,.18),transparent 65%)}
.gymv{--gold:#f5b51b;--gold2:#ffd56b;--gl:rgba(245,180,26,.35)}
.gymv .osw,.gtitle,.gname,.dname,.stitle,.gstrip,.rest-eq,.gbanner,.gbox h3{font-family:Oswald,Inter,sans-serif;text-transform:uppercase}
.ghero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end;padding:28px;border:1px solid var(--gl);border-radius:20px;margin-bottom:16px;background:radial-gradient(70% 120% at 100% 0%,rgba(245,180,26,.16),transparent 60%),linear-gradient(180deg,#0d0b07,#050505)}
.gtitle{margin:0;font-size:clamp(46px,7vw,84px);line-height:.9;font-weight:700;letter-spacing:.01em}
.gname{display:block;width:100%;font-size:clamp(34px,5.4vw,64px);line-height:1;font-weight:700;color:var(--gold);background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#c7860b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;padding:0}
.gstrip{display:inline-flex;gap:10px;flex-wrap:wrap;margin-top:14px;padding:6px 0;border-top:1px solid var(--gl);border-bottom:1px solid var(--gl);font-size:15px;letter-spacing:.06em;color:#e9e3d4}
.gstrip b{color:var(--gold)}
.gside{display:grid;gap:12px;justify-items:end}
.gquote{border-left:3px solid var(--gold);padding:4px 0 4px 12px;font-family:Oswald,Inter,sans-serif;text-transform:uppercase;font-size:15px;line-height:1.25;letter-spacing:.04em;max-width:14em}
.gymv .ib{border-color:var(--gl)}.gymv .btn.w{background:var(--gold);color:#000}
.gdays{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.gcard{border:1px solid var(--gl);border-radius:16px;background:linear-gradient(180deg,#0e0e0e,#070707);overflow:hidden;display:flex;flex-direction:column}
.gcard.tdc{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset,0 18px 50px -25px rgba(245,180,26,.7)}
.gcard.over{background:linear-gradient(180deg,rgba(245,180,26,.12),#070707)}
.ghd{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid rgba(245,180,26,.18)}
.dico{width:52px;height:52px;border-radius:10px;border:1px solid var(--gl);display:grid;place-items:center;background:#120f08}
.dico svg,.eqp svg,.rico svg,.gbox svg{fill:none;stroke:var(--gold);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dico svg{width:30px;height:30px}
.dname{font-size:22px;font-weight:700;line-height:1;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.hoyb{font:600 11px Inter;background:var(--gold);color:#000;border-radius:5px;padding:2px 6px;letter-spacing:0}
.stitle{width:100%;font-size:17px;font-weight:600;color:var(--gold);letter-spacing:.03em;padding:0;margin-top:2px}
.eqp{display:flex;align-items:center;gap:4px}.eqp>svg{width:44px;height:44px;opacity:.85;margin-right:4px}
.gymv .mini{border-color:rgba(245,180,26,.25);background:#14110a}
.gymv .mini:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.exl{display:grid;padding:8px 10px;min-height:36px}
.ex{border-radius:8px}
.exr{display:grid;grid-template-columns:14px 20px minmax(0,1fr) auto 30px;gap:9px;align-items:center;padding:7px 6px;border-bottom:1px dashed rgba(255,255,255,.07)}
.ex:last-child .exr{border-bottom:0}
.ex.op{background:#14110a}
.gymv input[type=checkbox]{border-color:rgba(245,180,26,.45);border-radius:5px;width:19px;height:19px}
.gymv input[type=checkbox]:checked{background:var(--gold);border-color:var(--gold)}
.gymv input[type=checkbox]:checked::after{border-color:#000}
.en{font-size:14.5px;color:#ece9e2;display:flex;gap:7px;align-items:baseline;overflow:hidden}
.en i{font-style:normal;font-size:11px;font-weight:600;color:var(--gold);flex:none}
.en small{color:var(--gold2);font-size:12px;opacity:.85;white-space:nowrap}
.ex.dn .en{color:#6d6a62;text-decoration:line-through}
.sr{font-family:Oswald,Inter,sans-serif;font-size:15px;color:#f4efe3;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:.02em}
.ex.dn .sr{color:#6d6a62}
.ed{width:30px;min-width:30px;height:30px;padding:0}
.hdl{cursor:grab;color:#4d4a42;font-size:12px;letter-spacing:-2px;user-select:none}.hdl:hover{color:var(--gold)}
.ex.drop-b{box-shadow:0 -3px 0 var(--gold)}.exl.drop-end::after{content:"";height:3px;border-radius:3px;background:var(--gold);margin-top:4px}
.ex.drag{opacity:.35}
.exe{padding:4px 8px 12px 43px;display:grid;gap:8px}
.exe .fx{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.exe label{font-size:11px;color:#8a8577;display:grid;gap:2px}
.exe input{font-size:13px;background:#1b170e;border:1px solid rgba(245,180,26,.15);border-radius:6px;padding:5px 7px}
.exe input:focus{border-color:var(--gold)}
.ops{display:flex;gap:4px;align-items:center;flex-wrap:wrap}.ops .x{opacity:1;margin-left:auto}
.gadd{margin:0 16px 12px;width:auto;background:transparent;border:1px dashed rgba(245,180,26,.3);border-radius:8px;padding:8px 10px;font-size:13.5px}
.gadd:focus{border-color:var(--gold)}
.gfoot{display:flex;align-items:center;gap:10px;margin-top:auto;padding:10px 16px;border-top:1px solid rgba(245,180,26,.18);background:#0b0904}
.gfoot svg{width:20px;height:20px;flex:none;fill:none;stroke:var(--gold);stroke-width:1.6}
.gfoot input{font-family:Oswald,Inter,sans-serif;text-transform:uppercase;color:var(--gold);letter-spacing:.04em;font-size:14px;padding:0}
.gfoot .pb{width:90px;height:4px;border-radius:4px;background:#221c0e;overflow:hidden;flex:none}.gfoot .pb em{background:var(--gold)}
.gfoot b{font:600 12.5px Inter;color:#cfc8b6;white-space:nowrap}
.rest{padding:18px 16px;display:grid;gap:14px}
.rest-eq{font-size:28px;font-weight:700;line-height:1;letter-spacing:.02em}.rest-eq span{color:var(--gold)}
.ricos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center}
.rico{display:grid;justify-items:center;gap:6px;font:600 11px Oswald,Inter;letter-spacing:.06em;text-transform:uppercase;color:#cfc8b6}
.rico svg{width:28px;height:28px}
.gboxes{display:grid;grid-template-columns:1.3fr 1fr 1fr .9fr;gap:12px;margin-top:14px}
.gbox{border:1px solid var(--gl);border-radius:14px;padding:14px 16px;background:#080808}
.gbox h3{margin:0 0 8px;font-size:16px;color:var(--gold);letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.gbox h3 svg{width:18px;height:18px}
.gbox ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px;color:#d8d2c3}
.gbox li{display:flex;gap:8px}.gbox li::before{content:"✓";color:var(--gold);font-weight:700;flex:none}
.gbig{font-family:Oswald,Inter,sans-serif;font-size:40px;font-weight:700;line-height:1;color:#fff;padding:0}
.gpill{display:inline-block;margin-top:8px;background:var(--gold);color:#000;font:600 12.5px Inter;padding:3px 10px;border-radius:6px}
.gpill input{color:#000;width:auto;font:inherit;padding:0;field-sizing:content;min-width:6ch}
.gbar{height:8px;border-radius:8px;background:#221c0e;overflow:hidden;margin:10px 0 6px}.gbar em{background:linear-gradient(90deg,#c7860b,var(--gold2))}
.gbanner{margin-top:14px;text-align:center;font-size:clamp(26px,4vw,40px);font-weight:700;letter-spacing:.04em;padding:14px;border-top:1px solid var(--gl);background:linear-gradient(180deg,transparent,rgba(245,180,26,.08))}
.gbanner span{color:var(--gold)}
@media(max-width:1000px){.gboxes{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){.gdays{grid-template-columns:minmax(0,1fr)}.ghero{grid-template-columns:minmax(0,1fr)}.gside{justify-items:start}}
@media(max-width:600px){.gboxes{grid-template-columns:minmax(0,1fr)}.exe{padding-left:8px}.exe .fx{grid-template-columns:repeat(2,minmax(0,1fr))}.ghero{padding:20px}}
.fkpi b small{font:500 12.5px Inter;color:var(--mut);display:block;letter-spacing:0}
.pos{color:#3ddc97}.neg{color:var(--red)}
.frow{display:grid;grid-template-columns:minmax(0,1.2fr) 120px 110px minmax(0,1.4fr) 110px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}
.frow .box{padding:7px 10px}.frow .box input{text-align:right;font-variant-numeric:tabular-nums}
.fr{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.fbar{height:8px;background:var(--p3);border-radius:8px;position:relative;overflow:visible}
.fbar em{border-radius:8px;max-width:100%}.fbar em.over{background:var(--red)}.fbar em.inc{background:#3ddc97}
.fbar i{position:absolute;top:-4px;bottom:-4px;width:2px;background:#fff;border-radius:2px;left:100%}
.fd{font-size:12.5px;text-align:right;white-space:nowrap}
.frow.c{grid-template-columns:minmax(0,1fr) 100px 100px}.frow.c .fbar{grid-column:1/-1;order:5}.frow.c .fd{grid-column:1/-1;text-align:left;order:6}
.fhead{color:var(--mut);font-size:12.5px;border-bottom:1px solid var(--ln);padding-bottom:6px}
.yr{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;height:180px;align-items:end;margin-top:12px}
.ym{display:grid;grid-template-rows:1fr auto;height:100%;gap:6px;text-align:center;font-size:11.5px;color:var(--mut)}
.yb{position:relative;display:flex;gap:3px;align-items:flex-end;justify-content:center}
.yb span{width:42%;max-width:16px;position:relative;height:100%;display:flex;align-items:flex-end}
.yb .p{position:absolute;bottom:0;left:0;right:0;border:1.5px dashed rgba(255,255,255,.35);border-radius:4px 4px 0 0}
.yb .r{position:relative;width:100%;border-radius:4px 4px 0 0}
.yb .ri{background:#3ddc97}.yb .rg{background:var(--b)}
.ym.cur{color:#fff;font-weight:600}
.lg{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--mut)}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.ibx{display:grid;gap:10px}
.ibi{border:1px solid var(--ln2);border-radius:14px;padding:12px 14px;background:var(--p2)}
.ibt{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ibt b{font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ibi .chips{margin-top:10px}.ibi .chip{min-height:32px;padding:4px 12px;font-size:13px}
.ibi .chip.i{border-color:rgba(61,220,151,.4)}
.txf{display:grid;grid-template-columns:150px minmax(0,1fr) 120px 180px auto;gap:8px;margin-bottom:10px}
.txf .box{padding:0 10px;height:44px;display:flex;align-items:center}
.txf input[type=date]{color-scheme:dark}
.amt{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.src{font-size:11px;padding:1px 7px;border-radius:999px;background:rgba(255,92,92,.12);color:#ff9a9a;margin-left:6px}
.tbl select{background:var(--p3);border:1px solid var(--ln);border-radius:8px;padding:5px 6px;width:auto;max-width:180px}
.botc{border-color:rgba(0,153,255,.35);background:radial-gradient(80% 140% at 100% 0%,rgba(0,102,255,.22),transparent 60%),linear-gradient(180deg,var(--p2),var(--p))}
@media(max-width:900px){.frow{grid-template-columns:minmax(0,1fr) 110px 100px;}.frow .fbar{grid-column:1/-1;order:5}.frow .fd{grid-column:1/-1;text-align:left}.fhead{display:none}.txf{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.soon{margin-left:auto;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--bs);color:#7cc8ff}
.foot{margin-top:auto;display:grid;gap:8px}
.sync{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut);padding:8px 10px;border:1px solid var(--ln);border-radius:10px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}

document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.gx){const[id,wk]=t.dataset.gx.split('|'),L=gLog(wk),j=L.done.indexOf(id);if(t.checked&&j<0)L.done.push(id);if(!t.checked&&j>=0)L.done.splice(j,1);touch('gym');render();return}
 if(t.dataset.gday&&t.value!==''){const[i,j]=t.dataset.gday.split('|').map(Number);gMove(i,j,Number(t.value),99);toast('Ejercicio movido a '+DIAS[Number(t.value)]);return}
 if(t.id==='dpick'&&t.value){sel=t.value;selM=sel.slice(0,7);render();return}
 if(t.type==='checkbox'&&t.dataset.k){setPath(doc(t.dataset.k),t.dataset.f,t.checked);touch(t.dataset.k);render()}
 if(t.type==='date'&&t.dataset.k)render();
 if(t.dataset.k==='gym'&&t.closest('.exe'))render();
 if(t.dataset.k&&t.dataset.k.startsWith('fin-'))render();
 if(t.dataset.txcat!=null){doc(FK(selM)).tx[Number(t.dataset.txcat)].cat=t.value;touch(FK(selM));render()}
 if(t.dataset.ibsel&&t.value)classify(t.dataset.ibsel,t.value);
 if(t.id==='imp'&&t.files[0]){t.files[0].text().then(x=>{const o=JSON.parse(x);if(!o||typeof o!=='object')throw 0;Object.assign(cache,o);Object.keys(o).forEach(k=>touch(k));render();toast('Copia importada')}).catch(()=>toast('Archivo no válido'));t.value=''}});
document.addEventListener('keydown',e=>{const t=e.target;
 if(e.key==='Escape'&&!$('#ov').hidden)closeC();
 if(e.key!=='Enter'||!t.value||!t.value.trim())return;
 if(t.dataset.add){e.preventDefault();const[k,f]=t.dataset.add.split('|'),d=doc(k);if(!Array.isArray(getPath(d,f)))setPath(d,f,[]);getPath(d,f).push({t:t.value.trim(),d:false});touch(k);render();const n=document.querySelector(`[data-add="${CSS.escape(t.dataset.add)}"]`);n&&n.focus()}
 else if(t.dataset.gadd){const i=Number(t.dataset.gadd);doc('gym').days[i].ex.push({id:'e'+Date.now().toString(36),par:'',name:t.value.trim(),mus:'',sets:'2',reps:'7–8',rir:'1–2 / 0–1',rest:'90 s–2 min'});touch('gym');render();const n=document.querySelector(`[data-gadd="${i}"]`);n&&n.focus()}
 else if(t.dataset.addh){const H=doc('habits');H.list.push({id:'h'+Date.now().toString(36),name:t.value.trim()});touch('habits');render();const n=document.querySelector('[data-addh]');n&&n.focus()}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const s=b.dataset;
 if(b.id==='ptg'){open=!open;try{localStorage.setItem('plOpen',open?'1':'0')}catch(er){}b.setAttribute('aria-expanded',open);$('#pgrp').hidden=!open;return}
 if(s.go!=null){if(s.go==='0')sel=TODAY;else{const D=pd(sel);D.setDate(D.getDate()+Number(s.go));sel=iso(D)}selM=sel.slice(0,7);render()}
 else if(s.date){sel=s.date;selM=sel.slice(0,7);render()}
 else if(s.open){sel=s.open;location.hash='hoy'}
 else if(s.mgo!=null){if(s.mgo==='0')selM=TODAY.slice(0,7);else{const[y,m]=selM.split('-').map(Number);selM=iso(new Date(y,m-1+Number(s.mgo),1)).slice(0,7)}render()}
 else if(s.del){const[k,f,i]=s.del.split('|');getPath(doc(k),f).splice(Number(i),1);touch(k);render()}
 else if(s.hab||s.hd){const[id,dt]=s.hd?s.hd.split('|'):[s.hab,sel],H=doc('habits'),a=H.log[dt]||(H.log[dt]=[]),j=a.indexOf(id);j<0?a.push(id):a.splice(j,1);touch('habits');render()}
 else if(s.hwater){const d=doc('day-'+TODAY),n=Number(s.hwater);d.water=d.water===n?n-1:n;touch('day-'+TODAY);render()}
 else if(s.water){const d=doc('day-'+sel),n=Number(s.water);d.water=d.water===n?n-1:n;touch('day-'+sel);render()}
 else if(s.mood){const d=doc('day-'+sel);d.mood=d.mood===s.mood?'':s.mood;touch('day-'+sel);render()}
 else if(s.ibcat){const[id,c]=s.ibcat.split('|');classify(id,c)}
 else if(s.ibx){delBox(s.ibx);inbox=inbox.filter(x=>x.id!==s.ibx);render()}
 else if(s.fincopy){const[y,m]=selM.split('-').map(Number),pv=cache[FK(iso(new Date(y,m-2,1)).slice(0,7))],F=doc(FK(selM));if(!pv||!Object.keys(pv.plan||{}).length){toast('El mes anterior no tiene previsto');return}for(const k in pv.plan)if(F.plan[k]==null||F.plan[k]==='')F.plan[k]=pv.plan[k];touch(FK(selM));render();toast('Previsto copiado')}
 else if(s.txadd){const a=num($('#tx_a').value),n=$('#tx_n').value.trim(),dt=$('#tx_d').value||TODAY;if(!a){toast('Indica un importe');return}const m=dt.slice(0,7);doc(FK(m)).tx.push({id:Date.now().toString(36),date:dt,desc:n,amount:a,cat:$('#tx_c').value,src:'manual'});touch(FK(m));render();toast(m===selM?'Movimiento añadido':'Añadido en '+MES[Number(m.slice(5))-1])}
 else if(s.catadd){const n=$('#nc_n').value.trim();if(!n)return;doc('fin-config').cats.push({id:'c'+Date.now().toString(36),name:n,t:$('#nc_t').value});touch('fin-config');render()}
 else if(s.gopen){gOpen=gOpen===s.gopen?null:s.gopen;render()}
 else if(s.gmv){const[i,j,d]=s.gmv.split('|').map(Number);gMove(i,j,i,d>0?j+2:j-1)}
 else if(s.gdel){const[i,j]=s.gdel.split('|').map(Number);doc('gym').days[i].ex.splice(j,1);touch('gym');render()}
 else if(s.gsw){const[i,d]=s.gsw.split('|').map(Number),G=doc('gym').days,k=i+d;[G[i],G[k]]=[G[k],G[i]];touch('gym');render();toast('Sesión movida a '+DIAS[k])}
 else if(s.gwk!=null){if(s.gwk==='0')gWk=wkOf(TODAY);else{const D=pd(gWk);D.setDate(D.getDate()+7*Number(s.gwk));gWk=iso(D)}render()}
 else if(s.tab){planTab=s.tab;render()}
 else if(s.tag){ctag=s.tag;render()}
 else if(s.newplan){doc(planTab).items.unshift({id:Date.now().toString(36),name:'',start:TODAY,due:'',obj:'',actions:[],notes:''});touch(planTab);render();const n=$('.pn');n&&n.focus()}
 else if(s.newc)openC(-1);
 else if(s.editc!=null)openC(Number(s.editc));
 else if(s.fudone){const c=doc('contacts').items.find(x=>x.id===s.fudone);if(c){c.last=TODAY;c.next='';touch('contacts');render();toast('Seguimiento completado')}}
});
$('#f_tag').innerHTML=TAGS.map(t=>`<option>${t}</option>`).join('');
$('#cx').onclick=closeC;$('#cc').onclick=closeC;
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeC()});
$('#cf').addEventListener('submit',e=>{e.preventDefault();const C=doc('contacts'),o={};['name','company','tag','phone','email','next','last','notes'].forEach(f=>o[f]=$('#f_'+f).value.trim());if(ei>=0)C.items[ei]={...C.items[ei],...o};else C.items.push({id:Date.now().toString(36),...o});touch('contacts');closeC();render();toast('Contacto guardado')});
$('#cdel').onclick=()=>{if(ei<0)return;doc('contacts').items.splice(ei,1);touch('contacts');closeC();render();toast('Contacto eliminado')};
$('#bk').onclick=()=>{try{navigator.clipboard.writeText(JSON.stringify(cache)).then(()=>toast('Copia copiada: pégala en un archivo .json'),()=>toast('No se pudo copiar'))}catch(err){toast('No se pudo copiar')}};
window.addEventListener('hashchange',render);
document.addEventListener('click',e=>{const c=e.target.closest('[data-cd]');if(c&&!e.target.closest('.dn')&&window.innerWidth<=600){sel=c.dataset.cd;render();const t=document.querySelector('.mnote textarea');t&&t.focus();return}if(e.target.closest('#morebtn')){$('#sfoot').appendChild($('.foot'));$('#sheet').hidden=false}else if(e.target.id==='sheet'){$('#sheet').hidden=true}});
window.matchMedia&&window.matchMedia('(min-width:901px)').addEventListener('change',q=>{if(q.matches)$('.side').appendChild($('.foot'))});
const clearDrop=()=>document.querySelectorAll('.drop-b,.drop-end,.over').forEach(n=>n.classList.remove('drop-b','drop-end','over'));
document.addEventListener('dragstart',e=>{const h=e.target.closest&&e.target.closest('.hdl');if(!h)return;const c=h.closest('.ex');const[i,j]=c.dataset.ex.split('|').map(Number);drag={i,j,tgt:null};e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain','ex');e.dataTransfer.setDragImage(c,20,20)}catch(er){}setTimeout(()=>c.classList.add('drag'),0)});
document.addEventListener('dragover',e=>{if(!drag)return;const col=e.target.closest('[data-drop]');if(!col)return;e.preventDefault();clearDrop();col.classList.add('over');const cards=[...col.querySelectorAll('.ex')];let idx=cards.findIndex(c=>{const r=c.getBoundingClientRect();return e.clientY<r.top+r.height/2});if(idx<0){idx=cards.length;col.querySelector('.exl').classList.add('drop-end')}else cards[idx].classList.add('drop-b');drag.tgt=[Number(col.dataset.drop),idx]});
document.addEventListener('drop',e=>{if(!drag||!drag.tgt)return;e.preventDefault();const{i,j,tgt}=drag;drag=null;clearDrop();gMove(i,j,tgt[0],tgt[1])});
document.addEventListener('dragend',()=>{drag=null;clearDrop();document.querySelectorAll('.ex.drag').forEach(n=>n.classList.remove('drag'))});

function classify(id,cat){const it=inbox.find(x=>x.id===id);if(!it)return;const dt=String(it.date||TODAY).slice(0,10),m=dt.slice(0,7);doc(FK(m)).tx.push({id:'g'+id,date:dt,desc:it.desc||it.merchant||'Cobro',amount:num(it.amount),cat,src:'gmail'});touch(FK(m));delBox(id);inbox=inbox.filter(x=>x.id!==id);render();toast('Clasificado')}
/* ---------- arranque ---------- */
try{cache=JSON.parse(localStorage.getItem('planner26')||'{}')||{}}catch(err){cache={}}
render();
function delBox(id){if(sb&&uid)sb.from('fin_inbox').delete().eq('id',id).then(()=>{},()=>{})}
const typing=()=>{const a=document.activeElement;return a&&a.closest&&a.closest('#main,.ov')&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)};
let started=false;
async function start(session){
 if(started)return;started=true;uid=session.user.id;$('#lov').hidden=true;$('#logout').hidden=false;$('#logout').textContent='Cerrar sesión ('+session.user.email+')';setSync('loading');
 try{
  const{data,error}=await sb.from('planner_docs').select('key,data').eq('user_id',uid);if(error)throw error;
  const remote={};(data||[]).forEach(r=>{remote[r.key]=r.data});
  const local=cache;cache=remote;col=true;
  for(const k in local)if(!(k in remote)){cache[k]=local[k];dirty.add(k)}
  const ib=await sb.from('fin_inbox').select('id,data').eq('user_id',uid);inbox=(ib.data||[]).map(r=>({...r.data,id:r.id}));
  setSync('cloud');if(!typing())render();if(dirty.size)flush();
  sb.channel('planner-'+uid)
   .on('postgres_changes',{event:'*',schema:'public',table:'planner_docs',filter:'user_id=eq.'+uid},p=>{const row=p.new;if(!row||!row.key||dirty.has(row.key))return;if(JSON.stringify(cache[row.key])===JSON.stringify(row.data))return;cache[row.key]=row.data;try{localStorage.setItem('planner26',JSON.stringify(cache))}catch(e){}if(!typing())render()})
   .on('postgres_changes',{event:'*',schema:'public',table:'fin_inbox',filter:'user_id=eq.'+uid},p=>{if(p.eventType==='DELETE'){inbox=inbox.filter(x=>x.id!==(p.old||{}).id)}else if(p.new){inbox=inbox.filter(x=>x.id!==p.new.id).concat([{...p.new.data,id:p.new.id}])}if(!typing())render()})
   .subscribe();
 }catch(e){col=null;started=false;setSync('error');toast('No se pudo conectar con la base de datos')}
}
const msg=t=>{$('#l_msg').textContent=t};
if(!window.supabase||!SUPABASE_URL){setSync('nocfg')}
else{
 sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
 sb.auth.getSession().then(({data})=>{if(data.session)start(data.session);else{setSync('loading');$('#lov').hidden=false;$('#l_e').focus()}});
 sb.auth.onAuthStateChange((ev,session)=>{if(session&&ev==='SIGNED_IN')start(session)});
 $('#lf').addEventListener('submit',async e=>{e.preventDefault();msg('Entrando…');const{error}=await sb.auth.signInWithPassword({email:$('#l_e').value.trim(),password:$('#l_p').value});if(error)msg(error.message==='Invalid login credentials'?'Email o contraseña incorrectos.':error.message)});
 $('#l_up').onclick=async()=>{const email=$('#l_e').value.trim(),password=$('#l_p').value;if(!email||password.length<6){msg('Escribe tu email y una contraseña de al menos 6 caracteres.');return}msg('Creando cuenta…');const{data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});if(error){msg(error.message);return}if(!data.session)msg('Revisa tu email y confirma la cuenta; luego vuelve aquí y entra.')};
 $('#logout').onclick=async()=>{await sb.auth.signOut();try{localStorage.removeItem('planner26')}catch(e){}location.reload()};
}
$('#paste').onclick=()=>{$('#pov').hidden=false;$('#p_t').focus()};
$('#p_x').onclick=()=>{$('#pov').hidden=true};
$('#p_ok').onclick=()=>{try{const o=JSON.parse($('#p_t').value);if(!o||typeof o!=='object')throw 0;Object.assign(cache,o);Object.keys(o).forEach(k=>touch(k));$('#pov').hidden=true;$('#p_t').value='';render();toast('Copia importada')}catch(e){toast('El texto no es una copia válida')}};
}
</script>
